<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Administración</title>

  <script>
    if (sessionStorage.getItem("sesionAdmin") !== "activa") {
      window.location.href = "login.html";
    }
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-controller"></i> Games <small class="fs-6 fw-normal">Admin</small></a>
      <div class="d-flex gap-2">
        <a href="catalogo.html" class="btn btn-outline-light btn-sm"><i class="bi bi-shop"></i> Ver tienda</a>
        <button type="button" class="btn btn-rojo btn-sm" onclick="cerrarSesion()">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="container my-4">

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card shadow tarjeta-resumen resumen-1">
          <div class="card-body">
            <small class="text-white-50">Total de productos</small>
            <p id="totalProductos" class="h3 fw-bold mb-0">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow tarjeta-resumen resumen-2">
          <div class="card-body">
            <small class="text-white-50">Unidades en stock</small>
            <p id="totalStock" class="h3 fw-bold mb-0">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow tarjeta-resumen resumen-3">
          <div class="card-body">
            <small class="text-white-50">Productos agotados</small>
            <p id="totalAgotados" class="h3 fw-bold mb-0">0</p>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-2 align-items-center mb-3">
      <div class="col-md-4">
        <h1 class="h4 fw-bold mb-0">Gestión de productos</h1>
      </div>
      <div class="col-md-5">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre...">
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-rojo w-100" onclick="abrirModalNuevo()">
          <i class="bi bi-plus-lg"></i> Nuevo producto
        </button>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 tabla-admin">
          <thead class="table-dark">
            <tr>
              <th>Imagen</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Plataforma</th>
              <th>Precio</th>
              <th>Stock</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos">
            <tr><td colspan="7" class="text-center text-muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="formProducto">

          <div class="modal-header">
            <h2 class="modal-title h5" id="tituloModal">Nuevo producto</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="id">

            <div class="row g-3">
              <div class="col-12">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label for="categoria" class="form-label">Categoría</label>
                <select id="categoria" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label for="plataforma" class="form-label">Plataforma</label>
                <select id="plataforma" class="form-select" required>
                  <option>Nintendo</option>
                  <option>PlayStation</option>
                  <option>Xbox</option>
                  <option>Multiplataforma</option>
                </select>
              </div>

              <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea id="descripcion" class="form-control" rows="2" required></textarea>
              </div>

              <div class="col-md-6">
                <label for="precio" class="form-label">Precio (Bs.)</label>
                <input type="number" id="precio" class="form-control" min="0" step="0.01" required>
              </div>
              <div class="col-md-6">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" id="stock" class="form-control" min="0" step="1" required>
              </div>

              <div class="col-12">
                <label for="imagenUrl" class="form-label">URL de la imagen</label>
                <input type="url" id="imagenUrl" class="form-control" placeholder="https://..." required>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-rojo">Guardar</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
