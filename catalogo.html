<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Catálogo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-controller"></i> Games</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#nosotros">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contáctanos</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html"><i class="bi bi-person-lock"></i> Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="encabezado-catalogo">
    <div class="container">
      <h1 class="mb-1">Catálogo de productos</h1>
      <p class="mb-0">Consolas, videojuegos físicos, accesorios y amiibos.</p>
    </div>
  </header>

  <main class="container mb-5">

    <div class="caja-filtros mb-4">
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre...">
      </div>

      <small class="text-muted fw-semibold d-block mb-2">Plataforma</small>
      <div id="filtrosPlataforma" class="filtros"></div>

      <small class="text-muted fw-semibold d-block mb-2 mt-1">Categoría</small>
      <div id="filtrosCategoria" class="filtros"></div>
    </div>

    <div id="aviso" class="alert d-none" role="alert"></div>

    <p id="mensaje" class="text-center text-muted"></p>

    <div id="listaProductos" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>

  </main>

  <footer class="py-4">
    <div class="container text-center">
      <p class="mb-1"><i class="bi bi-controller texto-rojo"></i> Games &copy; 2026 - Tienda de videojuegos</p>
      <small>Imágenes: Wikimedia Commons y AmiiboAPI.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
