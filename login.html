<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - Iniciar sesión</title>

  <!-- Bootstrap e íconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <main class="fondo-login d-flex align-items-center justify-content-center p-3">
    <div class="card caja-login shadow-lg border-0">
      <div class="card-body p-4">

        <div class="text-center mb-4">
          <i class="bi bi-controller icono-grande"></i>
          <h1 class="h4 fw-bold mt-2">Panel de administración</h1>
          <p class="text-muted small mb-0">Ingresa con tu cuenta de administrador</p>
        </div>

        <form id="formLogin">
          <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="password" id="contrasena" class="form-control" required>
          </div>

          <!-- Mensaje de error -->
          <div id="error" class="alert alert-danger py-2 d-none">Correo o contraseña incorrectos.</div>

          <button type="submit" class="btn btn-rojo w-100">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
          </button>
        </form>

        <div class="text-center mt-3">
          <a href="index.html" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Volver a la tienda</a>
        </div>

      </div>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
